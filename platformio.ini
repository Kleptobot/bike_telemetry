; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed-xiao-afruitnrf52-nrf52840-sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; The nRF52 TwoWire DMAs received bytes directly into its RingBuffer
    ; array, so an I2C read larger than SERIAL_BUFFER_SIZE (core default 64)
    ; writes past it. The LC76G driver reads 128-byte NMEA chunks, so raise
    ; the bound for the whole build. Costs ~800 B of static RAM across the
    ; Wire/Serial ring buffers.
    -DSERIAL_BUFFER_SIZE=256
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr
check_skip_packages = yes
lib_deps =
    greiman/SdFat@^2.3.1
    adafruit/Adafruit MCP23017 Arduino Library
    adafruit/Adafruit ST7735 and ST7789 Library
    seeed-studio/Seeed Arduino LSM6DS3
    infineon/XENSIV Digital Pressure Sensor
    bblanchon/ArduinoJson
    mikalhart/TinyGPSPlus
    teddokano/RTC_NXP_Arduino@^1.1.3